# To run a specific version of Jaeger, use environment variable, e.g.:
#     JAEGER_VERSION=1.52 docker compose up

services:
  jaeger:
    container_name: jaeger
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.15.1
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "14268:14268"
      # Prometheus metrics (Jaeger v2 / OTel). :14269 is no longer served by v2.
      - "8888:8888"
    environment:
      - LOG_LEVEL=debug
     #- QUERY_BASE_PATH=/jaeger
     # - COLLECTOR_OTLP_ENABLED=true
#      - COLLECTOR_ZIPKIN_HOST_PORT=9411
#      https://github.com/jaegertracing/jaeger/issues/5737
      - COLLECTOR_OTLP_GRPC_HOST_PORT=0.0.0.0:4317
      - COLLECTOR_OTLP_HTTP_HOST_PORT=0.0.0.0:4318
#    networks:
#      - jaeger-example
