# Jaeger v2 all-in-one config.
#
# The image's embedded default keeps traces in memory with no cap, so on
# observability1 the process grew to 1.8 GB in a few hours and pushed the 8 GB
# host into swap (and the kernel there does not enforce cgroup memory limits, so
# `mem_limit` cannot contain it). This keeps the same receivers the compose file
# publishes but bounds the in-memory store.
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    storage:
      traces: memory
  jaeger_storage:
    backends:
      memory:
        memory:
          # ~20k spans is a few minutes of traffic for this fleet and a few
          # hundred MB, instead of an unbounded 2 GB+.
          max_traces: 20000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory
